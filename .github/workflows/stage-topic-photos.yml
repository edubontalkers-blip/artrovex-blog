name: Stage topic-matched editorial photos
on:
  push:
    branches: [fix/seo-image-validation-20261011]
    paths:
      - '.github/workflows/stage-topic-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/seo-image-validation-20261011
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Match images to explicit article activities
        run: python scripts/reassign_clear_topic_photos.py
      - name: Verify photo integration
        run: python scripts/audit_editorial_photos.py
      - name: Verify article content and medical claim gate
        run: python scripts/prepublish_seo_gate.py
      - name: Verify technical SEO
        run: python scripts/seo_audit.py
      - name: Commit verified changes only to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/articles
          if ! git diff --cached --quiet; then
            git commit -m "Stage activity-matched article photos after full QA"
            git push origin HEAD:fix/seo-image-validation-20261011
          fi
