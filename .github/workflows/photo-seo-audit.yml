name: Photo integration and SEO audit
on:
  push:
    branches:
      - fix/seo-image-validation-20261011
    paths:
      - '.github/workflows/photo-seo-audit.yml'
      - 'scripts/audit_editorial_photos.py'
      - 'scripts/photo_relevance_review.py'
      - 'scripts/seo_audit.py'
      - 'scripts/prepublish_seo_gate.py'
      - 'scripts/normalize_seo_review.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/seo-image-validation-20261011
      - name: Check photo integration across all articles
        run: python scripts/audit_editorial_photos.py
      - name: Review editorial photo relevance
        run: python scripts/photo_relevance_review.py
      - name: Check article prepublication readiness
        if: always()
        run: python scripts/prepublish_seo_gate.py
      - name: Audit technical SEO
        if: always()
        run: python scripts/seo_audit.py

