name: Install editorial photography
on:
  push:
    branches: [main]
    paths:
      - 'scripts/install_editorial_photos.py'
      - 'docs/images/editorial/**'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
concurrency:
  group: editorial-photo-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install photographs on all existing pages
        run: python3 scripts/install_editorial_photos.py
      - name: Commit page enhancements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add relevant editorial photos to site pages"
          git pull --rebase origin main
          git push origin HEAD:main
