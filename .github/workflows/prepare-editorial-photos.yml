name: Prepare editorial photo replacements
on:
  push:
    branches:
      - fix/seo-image-validation-20261011
    paths:
      - '.github/workflows/prepare-editorial-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  editorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/seo-image-validation-20261011
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Verify Commons license and download original images
        run: python scripts/fetch_editorial_replacements.py
      - name: Commit verified images to review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/editorial/bodyadvice_33.webp docs/images/editorial/bodyadvice_36.webp docs/images/editorial/bodyadvice_37.webp docs/images/editorial/bodyadvice_38.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add four licensed editorial WebP replacements"
            git push origin HEAD:fix/seo-image-validation-20261011
          fi
