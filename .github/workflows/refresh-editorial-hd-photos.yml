name: Replace low-resolution photos with free HD photographs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_editorial_hd_photos.py'
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Download CC0 originals and optimize as WebP
        run: python scripts/refresh_editorial_hd_photos.py
      - name: Save only verified HD replacements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/editorial docs/image-credits.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Replace editorial thumbnails with licensed HD photos"
          git pull --rebase origin main
          git push origin HEAD:main
