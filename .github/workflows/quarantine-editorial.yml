name: Quarantine Unreviewed Editorial Articles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quarantine-editorial.yml'
      - 'scripts/quarantine_editorial_review.py'
      - 'scripts/rebuild_held_articles.py'
      - 'audits/title-triage-2026-10-11.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quarantine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Replace unverified personal stories with editorial notices
        run: python scripts/rebuild_held_articles.py
      - name: Noindex pending-review pages
        run: python scripts/quarantine_editorial_review.py
      - name: Commit review quarantine
        run: |
          git config user.name "Body Advice Editorial Bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/articles/
          git diff --cached --quiet || git commit -m "Replace 226 unverified articles with transparent editorial notices"
          git push origin main
